<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Power menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.nokeys .kbd,.nokeys .hint,.nokeys .num,.nokeys .key{display:none !important}
.glass{background:rgba(22,14,30,.44);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.20),inset 0 -1px 0 rgba(255,255,255,.04),0 10px 34px rgba(0,0,0,.38)}
.ic{width:30px;height:30px;flex:none}
.t{position:relative;width:150px;height:150px;border-radius:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:14px;font-weight:500;box-sizing:border-box}
.key{position:absolute;top:12px;right:14px;font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18)}
.win{position:absolute;border-radius:14px;background:rgba(27,20,33,.92);border:1px solid rgba(255,255,255,.08)}
</style>
</helmet>
<div class="{{keysCls}}" onClick="{{toggle}}" style="position: relative; width: 1600px; height: 900px; overflow: hidden; font-family: 'Geist', system-ui, sans-serif; color: #EEE6F2; background: #140b1a">
<img src="/_blob/e2d4fb1e43be60fddcfcb845b76df437" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
<div class="win" style="left: 12px; top: 60px; width: 860px; height: 828px"></div>
<div class="win" style="left: 882px; top: 60px; width: 706px; height: 466px; background: #262030"></div>
<div class="win" style="left: 882px; top: 536px; width: 706px; height: 352px"></div>
<div style="position: absolute; inset: 0; background: rgba(8,4,12,.5); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px)"></div>

<div style="position: absolute; left: 0; right: 0; top: 375px; display: flex; justify-content: center; gap: 18px">
  <div class="t glass"><span class="key">L</span>
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>Lock</div>
  <div class="t glass" style="box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 0 0 3px rgba(230,182,255,.55), 0 14px 40px rgba(0,0,0,.4)"><span class="key">S</span>
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>Suspend</div>
  <div class="t glass"><span class="key">O</span>
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5M21 12H9"></path></svg>Log out</div>
  <div class="t glass"><span class="key">R</span>
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M3 21v-5h5"></path></svg>Reboot</div>
  <div class="t glass"><span class="key">P</span>
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 2v10"></path><path d="M18.4 6.6a9 9 0 1 1-12.77.04"></path></svg>Power off</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showKeys":{"editor":"boolean","default":false},"$preview":{"width":1600,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const on = s.keys !== undefined ? s.keys : !!this.props.showKeys;
    return { keysCls: on ? 'keys' : 'nokeys', toggle: () => this.setState({ keys: !on }) };
  }
}
</script>
</body>
</html>
