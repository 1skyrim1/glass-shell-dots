# xdg-desktop-portal-hyprland: screen sharing asks the shell's picker (DESIGN.md §3.7, 25-SharePicker).
# The path must be absolute: xdph checks that the file exists before running it, so ~ or $HOME don't work;
# hence a system-wide script (system/usr/local/bin/glass-share-picker, installed by install.sh).
# Restart the portal after changing this:  systemctl --user restart xdg-desktop-portal-hyprland
screencopy {
    custom_picker_binary = /usr/local/bin/glass-share-picker
    allow_token_by_default = false
}
