# kitty for Glass Shell (the terminal in design/screens/08-Main). Colours come from the wallpaper: matugen
# writes colors.conf (not in the repo) and sends SIGUSR1, which reloads this file in every running kitty.
# Sizes are in pt; this screen's logical px = pt × 4/3 (design px × 0.8, like the rest of the shell).

# --- Font: Geist Mono, the shell's code font (DESIGN.md §1.3). Design: 12.4 px text on a 19 px line.
font_family      family="Geist Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        7.5
modify_font      cell_height 114%
disable_ligatures cursor
# Nerd Font icons come from kitty's built-in Symbols Nerd Font; nothing to install.

# --- Glass: a see-through surface; Hyprland blurs the wallpaper behind it (its global blur, conf/look.lua).
background_opacity 0.82
dynamic_background_opacity yes

# --- Layout: a small inner margin like the design's editor, thin borders between splits.
window_padding_width 6 10
placement_strategy   top-left
hide_window_decorations yes
draw_minimal_borders yes
window_border_width  1px
inactive_text_alpha  0.85
enabled_layouts      splits, stack

# --- Tabs (the design's file tabs): only with 2+ tabs, at the top; the active tab is a lighter block,
# the others plain muted text (tab colours: matugen template kitty-colors.conf).
tab_bar_edge         top
tab_bar_style        separator
tab_separator        ""
tab_title_template   "  {title[:30]}  "
active_tab_font_style   normal
inactive_tab_font_style normal
tab_bar_margin_width  4
tab_bar_margin_height 6.5 2
tab_bar_margin_color  none
tab_bar_min_tabs      2

# --- Cursor: a thin accent beam; the trail glides when it jumps (§5: things move, they don't teleport).
cursor_shape          beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.6
cursor_stop_blinking_after 10
cursor_trail          3
cursor_trail_decay    0.08 0.25
custom_shaders	      cursor-trail-blaze

# --- Behaviour
scrollback_lines       10000
mouse_hide_wait        2
url_style              curly
show_hyperlink_targets yes
strip_trailing_spaces  smart
enable_audio_bell      no
visual_bell_duration   0
confirm_os_window_close 0
shell_integration      enabled
update_check_interval  0

include colors.conf
