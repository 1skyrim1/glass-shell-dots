# Generated by matugen (templates/kitty-colors.conf); kitty.conf includes it, SIGUSR1 reloads it.
foreground              {{colors.on_surface.default.hex}}
background              {{colors.surface.default.hex}}
selection_foreground    {{colors.on_primary_container.default.hex}}
selection_background    {{colors.primary_container.default.hex}}
cursor                  {{colors.primary.default.hex}}
cursor_text_color       {{colors.on_primary.default.hex}}
url_color               {{colors.tertiary.default.hex}}
active_border_color     {{colors.primary.default.hex}}
inactive_border_color   {{colors.outline_variant.default.hex}}
# Tabs: the active one a lighter block, the others muted text on the terminal's own (see-through) background.
active_tab_foreground   {{colors.on_surface.default.hex}}
active_tab_background   {{colors.surface_container_highest.default.hex}}
inactive_tab_foreground {{colors.on_surface_variant.default.hex}}
inactive_tab_background {{colors.surface.default.hex}}
tab_bar_background      none

# ANSI: red / green / yellow / cyan keep their hue (tone-mapped to the scheme, config.toml), blue and
# magenta are the wallpaper's primary and tertiary.
color0  {{colors.surface_container_highest.default.hex}}
color8  {{colors.outline_variant.default.hex}}
color1  {{colors.red.default.hex}}
color9  {{colors.red.default.hex | lighten: 8}}
color2  {{colors.green.default.hex}}
color10 {{colors.green.default.hex | lighten: 8}}
color3  {{colors.yellow.default.hex}}
color11 {{colors.yellow.default.hex | lighten: 8}}
color4  {{colors.primary.default.hex}}
color12 {{colors.primary.default.hex | lighten: 8}}
color5  {{colors.tertiary.default.hex}}
color13 {{colors.tertiary.default.hex | lighten: 8}}
color6  {{colors.cyan.default.hex}}
color14 {{colors.cyan.default.hex | lighten: 8}}
color7  {{colors.on_surface_variant.default.hex}}
color15 {{colors.on_surface.default.hex}}
